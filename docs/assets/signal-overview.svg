<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Aero Signal 架构概览</title>
  <desc id="desc">展示管理后台、API、业务服务、任务管线、连接器、采集器和存储之间的关系。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="1" stop-color="#122a45"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#37d6b0"/>
      <stop offset="1" stop-color="#4ca8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#5ec8e5"/>
    </marker>
    <style>
      .title{font:700 38px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#f2f8ff}
      .sub{font:400 17px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#abc5df}
      .boxTitle{font:700 20px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#f4fbff}
      .boxText{font:400 14px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#b8cee1}
      .pill{font:600 13px 'Segoe UI','Microsoft YaHei',sans-serif;fill:#071426}
      .line{stroke:#5ec8e5;stroke-width:2;fill:none;marker-end:url(#arrow);opacity:.85}
    </style>
  </defs>
  <rect width="1200" height="620" rx="26" fill="url(#bg)"/>
  <circle cx="1080" cy="70" r="140" fill="#245885" opacity=".18"/>
  <circle cx="80" cy="560" r="180" fill="#1ca888" opacity=".12"/>

  <text x="70" y="72" class="title">Aero Signal</text>
  <text x="70" y="105" class="sub">公众号采集 · 语义清洗 · 版本归档 · 增量分发</text>
  <rect x="916" y="53" width="210" height="36" rx="18" fill="url(#accent)"/>
  <text x="1021" y="77" text-anchor="middle" class="pill">安全边界内的持久工作流</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="205" height="120" rx="18" fill="#163653" stroke="#2f678b"/>
    <text x="94" y="207" class="boxTitle">管理后台 / 客户端</text>
    <text x="94" y="239" class="boxText">Vue 管理端</text>
    <text x="94" y="263" class="boxText">分组 Token 消费 API</text>

    <rect x="365" y="150" width="260" height="160" rx="18" fill="#123f58" stroke="#3db3c3"/>
    <text x="389" y="190" class="boxTitle">Axum API + Service</text>
    <text x="389" y="222" class="boxText">鉴权 · DTO · 幂等 · 审计</text>
    <text x="389" y="246" class="boxText">来源 · 心跳 · 计划 · 文章</text>
    <text x="389" y="270" class="boxText">结构化错误 · 多维限流</text>

    <rect x="715" y="150" width="210" height="160" rx="18" fill="#143b55" stroke="#4f9ed1"/>
    <text x="739" y="190" class="boxTitle">Job Pipeline</text>
    <text x="739" y="222" class="boxText">持久任务与租约</text>
    <text x="739" y="246" class="boxText">重试 · 取消 · 进度</text>
    <text x="739" y="270" class="boxText">checkpoint · 幂等键</text>

    <rect x="985" y="170" width="145" height="120" rx="18" fill="#18354e" stroke="#4a7ba0"/>
    <text x="1009" y="207" class="boxTitle">数据层</text>
    <text x="1009" y="239" class="boxText">PostgreSQL</text>
    <text x="1009" y="263" class="boxText">Redis</text>

    <rect x="185" y="405" width="260" height="140" rx="18" fill="#123f48" stroke="#35b89f"/>
    <text x="209" y="445" class="boxTitle">Platform Connectors</text>
    <text x="209" y="477" class="boxText">授权账号候选发现</text>
    <text x="209" y="501" class="boxText">MP Admin · Fake · Capability</text>

    <rect x="505" y="385" width="280" height="180" rx="18" fill="#103c4a" stroke="#39c4ac"/>
    <text x="529" y="425" class="boxTitle">Crawler Capture</text>
    <text x="529" y="457" class="boxText">URL / SSRF / 有界重定向</text>
    <text x="529" y="481" class="boxText">正文语义 · 图片 · 浏览器兜底</text>
    <text x="529" y="505" class="boxText">资源部分成功 · 安全重试</text>
    <text x="529" y="529" class="boxText">revision · event · outbox</text>

    <rect x="845" y="405" width="260" height="140" rx="18" fill="#16364e" stroke="#4b91c2"/>
    <text x="869" y="445" class="boxTitle">外部能力与资产</text>
    <text x="869" y="477" class="boxText">MinIO/S3 · OCR Provider</text>
    <text x="869" y="501" class="boxText">SecretStore · CDP · Proxy</text>
  </g>

  <path class="line" d="M275 230 H355"/>
  <path class="line" d="M625 230 H705"/>
  <path class="line" d="M925 230 H975"/>
  <path class="line" d="M475 310 C445 350 390 370 340 397"/>
  <path class="line" d="M820 310 C800 350 735 365 690 379"/>
  <path class="line" d="M445 475 H495"/>
  <path class="line" d="M785 475 H835"/>

  <text x="70" y="594" class="sub">原则：授权优先 · 强身份幂等 · 单资源失败不丢正文 · 所有下游变化可追溯</text>
</svg>
